name: KainatLedger CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Dependencies
        run: |
          cd backend
          uv pip install --system -e ".[dev]"

      - name: Run Pytest
        run: |
          cd backend
          pytest -v

  flutter-ci:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Code
        run: |
          cd mobile
          flutter analyze --no-fatal-infos

      - name: Run Tests
        run: |
          cd mobile
          flutter test

      - name: Build Flutter Web
        run: |
          cd mobile
          flutter build web --release
