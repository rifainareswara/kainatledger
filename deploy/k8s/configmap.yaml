apiVersion: v1
kind: ConfigMap
metadata:
  name: kainatledger-config
  namespace: kainatledger
data:
  APP_NAME: "KainatLedger"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  ALLOWED_ORIGINS: "https://kainatledger-api.vanapp.co.id,http://localhost:8080"
