apiVersion: apps/v1
kind: Deployment
metadata:
  name: kainatledger-backend
  namespace: kainatledger
  labels:
    app: kainatledger-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kainatledger-backend
  template:
    metadata:
      labels:
        app: kainatledger-backend
    spec:
      containers:
        - name: backend
          image: magnus-registry-registry.ap-southeast-5.cr.aliyuncs.com/kainatledger/kainatledger:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kainatledger-config
            - secretRef:
                name: kainatledger-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
