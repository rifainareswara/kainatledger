apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kainatledger-ingress
  namespace: kainatledger
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: kainatledger-api.vanapp.co.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kainatledger-service
                port:
                  number: 8000
