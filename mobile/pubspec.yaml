name: kainatledger
description: KainatLedger — Personal Finance Tracker
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP client
  dio: ^5.5.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Local storage (non-sensitive: theme, locale)
  shared_preferences: ^2.3.2

  # JSON serialization
  json_annotation: ^4.9.0

  # Charts
  fl_chart: ^0.69.0

  # UI utilities
  intl: ^0.19.0
  gap: ^3.0.1

  # Icons (Material + custom)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^4.0.0

  # App icon generator
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app-icon.png"
  adaptive_icon_background: "#1976D2"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
